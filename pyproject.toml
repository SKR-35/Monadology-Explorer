[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monadology-explorer"
version = "1.0.0"
description = "A graph-based exploration of Leibniz's Monadology through concepts, relationships and interactive visualization."
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx>=3.5,<4",
    "plotly>=6,<7",
    "streamlit>=1.48,<2",
]

[project.optional-dependencies]
dev = [
    "beautifulsoup4>=4.13,<5",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]